<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TURN / Rubik's Cube V2</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&family=IBM+Plex+Mono:wght@400;500&display=swap');
:root{--bg:#ede9df;--black:#121212;--red:#ef493f;--blue:#174b70;--yellow:#f7c844;--green:#47a878;--orange:#ee8d46;--white:#f7f5eb;--card:#f5f1e8;--size:min(36vw,310px)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--black);font-family:Archivo,sans-serif}main{width:min(1240px,92vw);margin:auto;padding:28px 0 55px}.mast{display:flex;justify-content:space-between;align-items:center;border-bottom:3px solid var(--black);padding-bottom:13px}.brand{font-size:clamp(26px,4vw,54px);font-weight:800;letter-spacing:-.08em}.brand span{color:var(--red)}.brand i{font-style:normal;color:var(--blue)}.edition{font:11px 'IBM Plex Mono',monospace;text-transform:uppercase}.layout{display:grid;grid-template-columns:260px minmax(300px,1fr) 260px;gap:30px;align-items:start;padding-top:32px}.rail{display:grid;gap:18px}.card{background:var(--card);border:2px solid var(--black);padding:17px;box-shadow:5px 5px 0 var(--black)}h2{font-size:13px;text-transform:uppercase;letter-spacing:.08em;margin:0 0 15px}.label{font:10px 'IBM Plex Mono',monospace;text-transform:uppercase;display:block;margin:0 0 7px}.select,.sequence{width:100%;font:14px 'IBM Plex Mono',monospace;border:2px solid var(--black);background:var(--bg);padding:10px}.speed{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}.btn{border:2px solid var(--black);background:transparent;padding:10px 6px;font:500 12px 'IBM Plex Mono',monospace;cursor:pointer}.btn:hover,.btn:focus-visible{background:var(--yellow);outline:none}.btn.active{background:var(--black);color:var(--bg)}.wide{width:100%;margin-top:10px;background:var(--red);color:#fff}.ghost{width:100%;margin-top:7px}.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.keypad .btn{padding:12px 4px}.sequence-row{display:flex;gap:6px}.sequence-row .sequence{min-width:0}.sequence-row .btn{padding-inline:12px}.readout{font:12px 'IBM Plex Mono',monospace;border-top:1px solid #bbb;padding-top:10px;margin-top:11px;display:flex;justify-content:space-between}.readout b{font-weight:500}.history{font:11px 'IBM Plex Mono',monospace;line-height:1.7;max-height:110px;overflow:auto;word-break:break-word}.stage{text-align:center;min-width:0}.stage-title{font:11px 'IBM Plex Mono',monospace;text-transform:uppercase;margin:1px 0 13px}.viewport{height:470px;display:grid;place-items:center;cursor:grab;touch-action:none;user-select:none;overflow:hidden}.viewport.dragging{cursor:grabbing}.cube{width:var(--size);height:var(--size);position:relative;transform-style:preserve-3d;transform:rotateX(-22deg) rotateY(-32deg);transition:transform .18s ease;will-change:transform}.cubie{position:absolute;width:calc(var(--size)/var(--n));height:calc(var(--size)/var(--n));transform-style:preserve-3d;transition:transform var(--turn-speed,.42s) cubic-bezier(.2,.8,.2,1)}.sticker{position:absolute;inset:3px;border-radius:5px;border:1px solid #0005;backface-visibility:hidden;box-shadow:inset 0 0 0 1px #0003}.s-F{transform:translateZ(calc(var(--size)/var(--n)/2));background:var(--red)}.s-B{transform:rotateY(180deg) translateZ(calc(var(--size)/var(--n)/2));background:var(--orange)}.s-R{transform:rotateY(90deg) translateZ(calc(var(--size)/var(--n)/2));background:var(--green)}.s-L{transform:rotateY(-90deg) translateZ(calc(var(--size)/var(--n)/2));background:var(--blue)}.s-U{transform:rotateX(90deg) translateZ(calc(var(--size)/var(--n)/2));background:var(--yellow)}.s-D{transform:rotateX(-90deg) translateZ(calc(var(--size)/var(--n)/2));background:var(--white)}.turning{z-index:5}.turning:after{content:"";position:absolute;inset:2px;border:3px solid #fff8;border-radius:7px;animation:flash var(--turn-speed,.42s) ease}@keyframes flash{50%{transform:scale(1.08);filter:brightness(1.3)}}.solved{font:11px 'IBM Plex Mono',monospace;color:#555}.solved strong{color:var(--green)}@media(max-width:900px){.layout{grid-template-columns:1fr 1fr}.stage{grid-column:1/-1;grid-row:1}.rail:first-child{grid-column:1;grid-row:2}.rail:last-child{grid-column:2;grid-row:2}.viewport{height:390px}:root{--size:min(54vw,300px)}}@media(max-width:560px){main{width:94vw;padding-top:18px}.layout{display:flex;flex-direction:column}.stage{order:-1;width:100%}.rail{width:100%}.viewport{height:330px}:root{--size:min(72vw,290px)}}
</style></head><body><main><header class="mast"><div class="brand">TURN<span>/</span><i>V2</i></div><div class="edition">physical logic · 3×3 default</div></header><div class="layout">
<aside class="rail"><section class="card"><h2>Configuration</h2><label class="label" for="size">Format</label><select class="select" id="size"><option value="2">2 × 2</option><option value="3" selected>3 × 3</option><option value="twisted">3 × 3 twisted</option><option value="4">4 × 4</option></select><div class="readout"><span>Coups</span><b id="count">0</b></div><div class="readout"><span>État</span><b id="state">SOLVED</b></div></section><section class="card"><h2>Vitesse</h2><div class="speed" id="speeds"><button class="btn" data-speed="720">lent</button><button class="btn active" data-speed="420">normal</button><button class="btn" data-speed="190">rapide</button></div><button class="btn wide" id="scramble">Mélanger · 20 tours</button><button class="btn ghost" id="reset">Réinitialiser</button></section></aside>
<section class="stage"><div class="stage-title">← glisser pour observer · cliquer une touche pour tourner →</div><div class="viewport" id="viewport"><div class="cube" id="cube"></div></div><div class="solved">repère frontal <strong>F</strong> · axes libres</div></section>
<aside class="rail"><section class="card"><h2>Notation</h2><div class="sequence-row"><input class="sequence" id="sequence" value="R U R' U'" aria-label="Séquence de mouvements"><button class="btn" id="play">GO</button></div><div class="keypad" id="keypad" style="margin-top:13px"></div></section><section class="card"><h2>Journal</h2><div class="history" id="history">aucun mouvement</div></section></aside></div></main>
<style>.s-F{transform:translateZ(calc(var(--unit) / 2));background:var(--red)}.s-B{transform:rotateY(180deg) translateZ(calc(var(--unit) / 2));background:var(--orange)}.s-R{transform:rotateY(90deg) translateZ(calc(var(--unit) / 2));background:var(--green)}.s-L{transform:rotateY(-90deg) translateZ(calc(var(--unit) / 2));background:var(--blue)}.s-U{transform:rotateX(90deg) translateZ(calc(var(--unit) / 2));background:var(--yellow)}.s-D{transform:rotateX(-90deg) translateZ(calc(var(--unit) / 2));background:var(--white)}</style><script>
const faces=['U','D','F','B','R','L'];let n=3,speed=420,turns=0,history=[],cubies=[],busy=false,rotX=-22,rotY=-32;const cube=document.getElementById('cube'),viewport=document.getElementById('viewport');const defs={U:['y',1,1],D:['y',-1,-1],F:['z',1,-1],B:['z',-1,1],R:['x',1,-1],L:['x',-1,1]};
function makeCube(size){n=size;document.documentElement.style.setProperty('--n',n);cubies=[];cube.innerHTML='';for(let x=0;x<n;x++)for(let y=0;y<n;y++)for(let z=0;z<n;z++){let c={x,y,z,el:document.createElement('div')};c.el.className='cubie';for(const f of faces)if((f==='R'&&x===n-1)||(f==='L'&&x===0)||(f==='U'&&y===n-1)||(f==='D'&&y===0)||(f==='F'&&z===n-1)||(f==='B'&&z===0)){let s=document.createElement('i');s.className='sticker s-'+f;c.el.append(s)}cube.append(c.el);cubies.push(c)}layout()}
function layout(){const unit=cube.clientWidth/n;for(const c of cubies){const x=c.x*unit,y=(n-1-c.y)*unit,z=(c.z-(n-1)/2)*unit;c.el.style.transform=`translate3d(${x}px,${y}px,${z}px)`}}
function rotate(c,a,d){let m=n-1;if(a==='x'){let y=c.y,z=c.z;c.y=d>0?m-z:z;c.z=d>0?y:m-y}else if(a==='y'){let x=c.x,z=c.z;c.x=d>0?z:m-z;c.z=d>0?m-x:x}else{let x=c.x,y=c.y;c.x=d>0?m-y:y;c.y=d>0?x:m-x}}
function apply(token,record=true){if(busy)return;let d=defs[token[0]];if(!d)return;let times=token.includes('2')?2:1,dir=(token.includes("'")?-1:1)*d[2],layer=d[1]===1?n-1:0,affected=cubies.filter(c=>c[d[0]]===layer);busy=true;affected.forEach(c=>{c.el.classList.add('turning');c.el.style.setProperty('--turn-speed',speed+'ms')});for(let i=0;i<times;i++)affected.forEach(c=>rotate(c,d[0],dir));layout();setTimeout(()=>{affected.forEach(c=>c.el.classList.remove('turning'));busy=false},speed);if(record){history.push(token);turns++;update()}}
function parse(text){return text.trim().split(/\s+/).filter(x=>/^[UDFBRL](?:'|2)?$/.test(x))}function update(){document.getElementById('count').textContent=turns;document.getElementById('history').textContent=history.length?history.join(' '):'aucun mouvement';document.getElementById('state').textContent=turns?'MIXED':'SOLVED'}function reset(){history=[];turns=0;makeCube(n);update()}
document.getElementById('keypad').innerHTML=faces.flatMap(f=>['',"'",'2'].map(s=>`<button class="btn" data-move="${f+s}">${f+s}</button>`)).join('');document.querySelectorAll('[data-move]').forEach(b=>b.onclick=()=>apply(b.dataset.move));document.getElementById('play').onclick=()=>parse(document.getElementById('sequence').value).forEach((m,i)=>setTimeout(()=>apply(m),i*(speed+25)));document.getElementById('reset').onclick=reset;document.getElementById('size').onchange=e=>{let v=e.target.value;makeCube(v==='twisted'?3:+v);turns=0;history=[];if(v==='twisted')setTimeout(()=>apply('R'),0);update()};document.getElementById('scramble').onclick=()=>{reset();let p='';for(let i=0;i<20;i++){let f;do{f=faces[Math.floor(Math.random()*6)]}while(f===p);p=f;setTimeout(()=>apply(f+['',"'",'2'][Math.floor(Math.random()*3)]),i*(speed+25))}};document.querySelectorAll('[data-speed]').forEach(b=>b.onclick=()=>{speed=+b.dataset.speed;document.querySelectorAll('[data-speed]').forEach(x=>x.classList.toggle('active',x===b))});let drag=false,lastX=0,lastY=0;viewport.onpointerdown=e=>{drag=true;lastX=e.clientX;lastY=e.clientY;viewport.classList.add('dragging');viewport.setPointerCapture(e.pointerId)};viewport.onpointermove=e=>{if(!drag)return;rotY+=(e.clientX-lastX)*.45;rotX-=(e.clientY-lastY)*.45;rotX=Math.max(-80,Math.min(80,rotX));cube.style.transform=`rotateX(${rotX}deg) rotateY(${rotY}deg)`;lastX=e.clientX;lastY=e.clientY};viewport.onpointerup=()=>{drag=false;viewport.classList.remove('dragging')};makeCube(3);update();
</script><style>:root{--unit:calc(var(--size) / 3)}.s-F{transform:translateZ(calc(var(--unit) / 2));background:var(--red)}.s-B{transform:rotateY(180deg) translateZ(calc(var(--unit) / 2));background:var(--orange)}.s-R{transform:rotateY(90deg) translateZ(calc(var(--unit) / 2));background:var(--green)}.s-L{transform:rotateY(-90deg) translateZ(calc(var(--unit) / 2));background:var(--blue)}.s-U{transform:rotateX(90deg) translateZ(calc(var(--unit) / 2));background:var(--yellow)}.s-D{transform:rotateX(-90deg) translateZ(calc(var(--unit) / 2));background:var(--white)}</style></body></html>
